name: Sync upstream

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: "Upstream branch"
        required: true
        default: "release/v0.1.0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync from upstream
        env:
          UPSTREAM_BRANCH: ${{ inputs.upstream_branch || 'release/v0.1.0' }}
        run: |
          git remote add upstream https://github.com/KapeDoko/kapedoko-fe.git
          git fetch upstream "$UPSTREAM_BRANCH"

          git checkout "$UPSTREAM_BRANCH" 2>/dev/null || \
            git checkout -b "$UPSTREAM_BRANCH"

          git merge --ff-only "upstream/$UPSTREAM_BRANCH"
          git push origin "$UPSTREAM_BRANCH"